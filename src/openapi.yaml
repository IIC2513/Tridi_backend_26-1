openapi: 3.0.3
info:
  title: Tridi API
  version: 1.0.0
  description: API for Tridi application.
servers:
  - url: https://api.tridi.jessica.cl
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        image:
          type: string
          nullable: true
        seller:
          type: boolean
        role:
          type: string
        stats:
          type: object
          properties:
            c_sales:
              type: integer
            c_purchases:
              type: integer
            reputation:
              type: integer
    ModelTridi:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        price:
          type: number
        creatorId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              modelId:
                type: integer
              url:
                type: string
              type:
                type: string
        creator:
          $ref: '#/components/schemas/User'
    CartItem:
      type: object
      properties:
        id:
          type: integer
        cartId:
          type: integer
        modelId:
          type: integer
        createdAt:
          type: string
          format: date-time
        ModelTridi:
          $ref: '#/components/schemas/ModelTridi'
    Card:
      type: object
      properties:
        id:
          type: integer
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
        expYear:
          type: integer
        userId:
          type: integer
        createdAt:
          type: string
          format: date-time
    Purchase:
      type: object
      properties:
        id:
          type: integer
        buyerId:
          type: integer
        date:
          type: string
          format: date-time
        total:
          type: number
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        PurchaseItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              purchaseId:
                type: integer
              modelId:
                type: integer
              unitPrice:
                type: number
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
    Request:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        content:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            image:
              type: string
              nullable: true
    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        userId:
          type: integer
        modelId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            image:
              type: string
              nullable: true

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized: Session not found or logged out"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Forbidden: Invalid or expired token"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal server error"

paths:
  /users/:
    get:
      summary: Get all users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{username}:
    get:
      summary: Get user profile by username
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      image:
                        type: string
                        nullable: true
                      seller:
                        type: boolean
                      role:
                        type: string
                      stats:
                        type: object
                        properties:
                          c_sales:
                            type: integer
                          c_purchases:
                            type: integer
                          reputation:
                            type: number
        '404':
          description: User not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    put:
      summary: Update user profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
                image:
                  type: string
                seller:
                  type: boolean
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      image:
                        type: string
                        nullable: true
                      seller:
                        type: boolean
                      role:
                        type: string
                      email:
                        type: string
        '400':
          description: No valid fields to update or invalid image
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
        '409':
          description: Email or username already in use
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: User successfully deleted.
        '403':
          description: Forbidden
        '404':
          description: User not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /login:
    post:
      summary: User login
      description: Login using standard credentials or a Supabase provider token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                    - email
                    - password
                - type: object
                  properties:
                    providerToken:
                      type: string
                  required:
                    - providerToken
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
        '401':
          description: Unauthorized (Invalid credentials)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'

  /signup:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                username:
                  type: string
                image:
                  type: string
              required:
                - email
                - password
                - username
      responses:
        '200':
          description: Strategy successful but new user not created (e.g. existing third-party user).
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  session:
                    type: object
        '409':
          description: Strategy Error (e.g. Email already in use)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/:
    get:
      summary: Get all 3D models
      responses:
        '200':
          description: A list of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelTridi'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a new 3D model
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                tags:
                  type: array
                  items:
                    type: string
              required:
                - name
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelTridi'
        '400':
          description: Name is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/created/{ownerId}:
    get:
      summary: Get models created by a specific user
      parameters:
        - in: path
          name: ownerId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of models by the creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelTridi'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/{id}:
    get:
      summary: Get a specific 3D model
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The model details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelTridi'
        '404':
          description: Model not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update a 3D model
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Model updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelTridi'
        '400':
          description: No valid fields to update or name cannot be empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Model not found
        '422':
          description: Price must be a non-negative number
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a 3D model
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Model successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: Model successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Model not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/{id}/file:
    put:
      summary: Upload a file to a 3D model
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: filename
          required: true
          schema:
            type: string
          description: File name with extension (.glb or .gltf)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          model/gltf-binary:
            schema:
              type: string
              format: binary
          model/gltf+json:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelTridi'
        '400':
          description: Format not supported, missing file, or file too large
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Model not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart:
    get:
      summary: Get user's cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      subtotal:
                        type: number
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CartItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/items:
    post:
      summary: Add item to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modelId:
                  type: integer
              required:
                - modelId
      responses:
        '201':
          description: Added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CartItem'
        '200':
          description: Already in cart
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/items/{id}:
    delete:
      summary: Remove item from cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        '404':
          description: Not Found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards:
    get:
      summary: Get saved payment methods
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Save a new card
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                expMonth:
                  type: integer
                expYear:
                  type: integer
              required:
                - number
                - expMonth
                - expYear
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Card'
        '400':
          description: Bad Request
        '422':
          description: Unprocessable Entity

  /cards/{id}:
    delete:
      summary: Delete a saved card
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Card deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Card not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /purchases:
    post:
      summary: Create a new purchase
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '422':
          description: Cart is empty
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get all purchases
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Purchase'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /purchases/{id}:
    get:
      summary: Get purchase details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Purchase details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Purchase not found

  /purchases/{id}/status:
    patch:
      summary: Update purchase status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
              required:
                - status
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Purchase not found
        '409':
          description: Conflict (Invalid transition)

  /purchases/{id}/pay:
    post:
      summary: Process purchase payment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardId:
                  type: integer
              required:
                - cardId
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase:
                    $ref: '#/components/schemas/Purchase'
                  transactionId:
                    type: string
        '402':
          description: Payment Required (Failed)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Purchase or Card not found
        '409':
          description: Conflict

  /purchases/items/by/{buyerId}:
    get:
      summary: Get purchased models by buyer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: buyerId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of purchased models (completed purchases only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelTridi'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /requests:
    post:
      summary: Create a request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                content:
                  type: string
              required:
                - type
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Request'
        '400':
          description: Bad Request
        '409':
          description: You already have a pending request of this type
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get all requests (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /requests/my:
    get:
      summary: Get current user's requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /requests/pending:
    get:
      summary: Get pending requests (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /requests/{requestId}:
    patch:
      summary: Update request status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - approved
                    - rejected
              required:
                - status
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Request'
        '400':
          description: Invalid status
        '404':
          description: Request not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /comments:
    post:
      summary: Create a comment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                modelId:
                  type: integer
              required:
                - content
                - modelId
      responses:
        '201':
          description: Comment created
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 3D Model not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /models/{id}/comments:
    get:
      summary: Get comments for a 3D model
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '404':
          description: 3D Model not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /comments/{id}:
    patch:
      summary: Update a comment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
      responses:
        '200':
          description: Comment updated
        '400':
          description: Content is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Comment not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a comment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comment successfully deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Comment not found
        '500':
          $ref: '#/components/responses/InternalServerError'